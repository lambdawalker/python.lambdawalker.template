[build-system]
requires = ["uv_build>=0.8.0"]
build-backend = "uv_build"

[project]
name = "lambdawalker-template"
version = "0.1.0"
description = "HTML/Jinja template rendering server and Playwright screenshot engine for LambdaWalker"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "LambdaWalker", email = "lambdawalker@isdavid.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
dependencies = [
    "lambdawalker-dataset>=0.1.0",
    "lambdawalker-draw>=0.1.0",
    "lambdawalker-file>=0.1.0",
    "lambdawalker-generate>=0.1.0",
    "lambdawalker-reflection>=0.1.0",
    "fastapi>=0.115.0",
    "playwright>=1.40.0",
    "jinja2>=3.1.0",
    "starlette>=0.30.0",
    "requests>=2.30.0",
    "pyyaml",
    "Pillow>=10.0.0"
]

[project.urls]
Homepage = "https://github.com/lambdawalker/python.lambdawalker.template"
Repository = "https://github.com/lambdawalker/python.lambdawalker.template"
Issues = "https://github.com/lambdawalker/python.lambdawalker.template/issues"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "bandit[toml]>=1.7.9",
    "pip-audit>=2.7.0",
]

[tool.uv.build-backend]
module-name = "lambdawalker.template"
namespace = true

[tool.uv.sources]
lambdawalker-dataset = { git = "ssh://git@github.com/lambdawalker/python.lambdawalker.dataset.git" }
lambdawalker-draw = { git = "ssh://git@github.com/lambdawalker/python.lambdawalker.draw.git" }
lambdawalker-file = { git = "ssh://git@github.com/lambdawalker/python.lambdawalker.file.git" }
lambdawalker-generate = { git = "ssh://git@github.com/lambdawalker/python.lambdawalker.generate.git" }
lambdawalker-reflection = { git = "ssh://git@github.com/lambdawalker/python.lambdawalker.reflection.git" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
