[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lambdawalker-template"
version = "0.1.0"
description = "HTML/Jinja template rendering server and Playwright screenshot engine for LambdaWalker"
readme = "README.md"
requires-python = ">=3.8"
authors = [
  { name = "LambdaWalker", email = "lambdawalker@isdavid.com" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]
dependencies = [
  "lambdawalker-dataset>=0.1.0",
  "lambdawalker-draw>=0.1.0",
  "lambdawalker-file>=0.1.0",
  "lambdawalker-generate>=0.1.0",
  "lambdawalker-reflection>=0.1.0",
  "fastapi>=0.115.0",
  "playwright>=1.40.0",
  "jinja2>=3.1.0",
  "starlette>=0.30.0",
  "requests>=2.30.0",
  "pyyaml",
  "Pillow>=10.0.0"
]

[project.urls]
Homepage = "https://github.com/lambdawalker/python_lw_drawing_tools"
Repository = "https://github.com/lambdawalker/python_lw_drawing_tools"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lambdawalker.template" = ["assets/**"]
